name: Prisma Compute Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Validate Prisma token
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_PROJECT_ID: ${{ secrets.PRISMA_PROJECT_ID }}
          PRISMA_APP_ID: ${{ secrets.PRISMA_APP_ID }}
        run: |
          if [ -z "$PRISMA_SERVICE_TOKEN" ]; then
            echo "Missing GitHub secret: PRISMA_SERVICE_TOKEN"
            exit 1
          fi
          if [ -z "$PRISMA_PROJECT_ID" ] || [ -z "$PRISMA_APP_ID" ]; then
            echo "Missing GitHub secrets: PRISMA_PROJECT_ID and/or PRISMA_APP_ID"
            exit 1
          fi
          bunx @prisma/cli@latest auth whoami

      - name: List visible Prisma projects
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_PROJECT_ID: ${{ secrets.PRISMA_PROJECT_ID }}
          PRISMA_APP_ID: ${{ secrets.PRISMA_APP_ID }}
        run: bunx @prisma/cli@latest project list --json

      - name: Deploy app to Prisma Compute
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_PROJECT_ID: ${{ secrets.PRISMA_PROJECT_ID }}
          PRISMA_APP_ID: ${{ secrets.PRISMA_APP_ID }}
        run: |
          rm -rf .prisma
          bunx @prisma/cli@latest app deploy --project "$PRISMA_PROJECT_ID" --app "$PRISMA_APP_ID" --branch main --framework nextjs --no-interactive --yes --json
