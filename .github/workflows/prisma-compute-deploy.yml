name: Prisma Compute Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Validate Prisma token
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          # Use non-PRISMA_* names: --project and env PRISMA_PROJECT_ID are mutually exclusive.
          DEPLOY_PROJECT: ${{ secrets.PRISMA_PROJECT_ID }}
          DEPLOY_APP: ${{ secrets.PRISMA_APP_ID }}
        run: |
          if [ -z "$PRISMA_SERVICE_TOKEN" ]; then
            echo "Missing GitHub secret: PRISMA_SERVICE_TOKEN"
            exit 1
          fi
          if [ -z "$DEPLOY_PROJECT" ] || [ -z "$DEPLOY_APP" ]; then
            echo "Missing GitHub secrets: PRISMA_PROJECT_ID and/or PRISMA_APP_ID"
            exit 1
          fi
          bunx @prisma/cli@latest auth whoami

      - name: List visible Prisma projects
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        run: bunx @prisma/cli@latest project list --json

      - name: Deploy app to Prisma Compute
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          DEPLOY_PROJECT: ${{ secrets.PRISMA_PROJECT_ID }}
          DEPLOY_APP: ${{ secrets.PRISMA_APP_ID }}
        run: |
          rm -rf .prisma
          bunx @prisma/cli@latest app deploy \
            --project "$DEPLOY_PROJECT" \
            --app "$DEPLOY_APP" \
            --branch main \
            --framework nextjs \
            --prod \
            --no-interactive \
            --yes \
            --json
